# Chinese field reference: README.md#alembic-settings
[alembic]
# Find the migration scripts relative to this INI file.
script_location = %(here)s/migrations
# Add this directory to the Python import path.
prepend_sys_path = %(here)s
# Split path lists using the OS path separator.
path_separator = os
# Fallback connection URL if DANG_DATABASE_URL is unset.
sqlalchemy.url =

[loggers]
# Configure the root, SQLAlchemy engine and Alembic loggers.
keys = root,sqlalchemy,alembic

[handlers]
# Register the console output handler.
keys = console

[formatters]
# Register the shared log format.
keys = generic

[logger_root]
# Minimum severity emitted by the root logger.
level = WARN
# Send root logger messages to the console.
handlers = console

[logger_sqlalchemy]
# Minimum severity emitted by the SQLAlchemy engine logger.
level = WARN
# Use the parent logger for output.
handlers =
# Python logger name for SQLAlchemy engine messages.
qualname = sqlalchemy.engine

[logger_alembic]
# Minimum severity emitted by the Alembic logger.
level = INFO
# Use the parent logger for output.
handlers =
# Python logger name for migration messages.
qualname = alembic

[handler_console]
# Write logs to an output stream.
class = StreamHandler
# Write to standard error.
args = (sys.stderr,)
# Accept all severities passed by the loggers.
level = NOTSET
# Use the shared format defined below.
formatter = generic

[formatter_generic]
# Show severity, logger name and message in each line.
format = %(levelname)-5.5s [%(name)s] %(message)s
