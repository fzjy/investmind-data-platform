# 仅生产/隔离演练显式叠加；不改变默认本机 Compose。
# 源文件由部署方 Secret 工具提供，禁止提交；普通 Compose 挂载不是加密密钥库。
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  migrate:
    environment:
      DANG_DATABASE_URL: ""
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
  bootstrap:
    environment:
      DANG_DATABASE_URL: ""
      DANG_DATABASE_READ_URL: ""
      DANG_TUSHARE_TOKEN: ""
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      DANG_DATABASE_READ_URL_FILE: /run/secrets/database_url
      DANG_TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
    secrets: [database_url, tushare_token]
  api:
    environment:
      DANG_DATABASE_URL: ""
      DANG_DATABASE_READ_URL: ""
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      DANG_DATABASE_READ_URL_FILE: /run/secrets/database_read_url
    secrets: [database_url, database_read_url]
  scheduler:
    environment:
      DANG_DATABASE_URL: ""
      DANG_TUSHARE_TOKEN: ""
      DANG_FRED_API_KEY: ""
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      DANG_TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
      DANG_FRED_API_KEY_FILE: /run/secrets/fred_api_key
    secrets: [database_url, tushare_token, fred_api_key]
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  database_url:
    file: ./.secrets/database_url
  database_read_url:
    file: ./.secrets/database_read_url
  tushare_token:
    file: ./.secrets/tushare_token
  fred_api_key:
    file: ./.secrets/fred_api_key
