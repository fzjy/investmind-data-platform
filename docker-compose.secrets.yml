# 仅生产/隔离演练显式叠加；不改变默认本机 Compose。
# 源文件由部署方 Secret 工具提供，禁止提交；普通 Compose 挂载不是加密密钥库。
services:
  postgres:
    environment:
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      POSTGRES_PASSWORD: ""
      # PostgreSQL 初始化角色所用的密码文件。
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # 将列出的密钥挂载到本服务的 /run/secrets/。
    secrets: [postgres_password]
  migrate:
    environment:
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_URL: ""
      # 应用读取数据库主连接串的文件。
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
    # 将列出的密钥挂载到本服务的 /run/secrets/。
    secrets: [database_url]
  bootstrap:
    environment:
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_URL: ""
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_READ_URL: ""
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_TUSHARE_TOKEN: ""
      # 应用读取数据库主连接串的文件。
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      # 初始化时的读连接，与该服务的主连接复用同一文件。
      DANG_DATABASE_READ_URL_FILE: /run/secrets/database_url
      # 请求 Tushare 时读取的令牌文件。
      DANG_TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
    # 将列出的密钥挂载到本服务的 /run/secrets/。
    secrets: [database_url, tushare_token]
  api:
    environment:
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_URL: ""
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_READ_URL: ""
      # 应用读取数据库主连接串的文件。
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      # API 读取已发布数据时所用的独立连接串文件。
      DANG_DATABASE_READ_URL_FILE: /run/secrets/database_read_url
    # 将列出的密钥挂载到本服务的 /run/secrets/。
    secrets: [database_url, database_read_url]
  scheduler:
    environment:
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_DATABASE_URL: ""
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_TUSHARE_TOKEN: ""
      # 清空基础文件中的直接赋值，使此服务从挂载的密钥文件读取。
      DANG_FRED_API_KEY: ""
      # 应用读取数据库主连接串的文件。
      DANG_DATABASE_URL_FILE: /run/secrets/database_url
      # 请求 Tushare 时读取的令牌文件。
      DANG_TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
      # 请求 FRED 时读取的密钥文件。
      DANG_FRED_API_KEY_FILE: /run/secrets/fred_api_key
    # 将列出的密钥挂载到本服务的 /run/secrets/。
    secrets: [database_url, tushare_token, fred_api_key]
# 各 file 路径相对于项目，部署方在宿主机提供相应文件。
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  database_url:
    file: ./.secrets/database_url
  database_read_url:
    file: ./.secrets/database_read_url
  tushare_token:
    file: ./.secrets/tushare_token
  fred_api_key:
    file: ./.secrets/fred_api_key
